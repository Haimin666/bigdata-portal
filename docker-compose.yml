# bigdata-portal Docker Compose
#
# 一键脚本入口:scripts/dockerctl.sh(等价命令见 README)。
# 凭证与各系统目标地址由 .env.local 在运行时注入(不经 .dockerignore,不会进镜像)。
# 若 .env.local 缺失,服务仍可启动,但子系统地址/免登录凭证回退到默认值。
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 内网构建无法访问 docker.io 时,设置 BASE_IMAGE 指向内部 registry,如:
        #   BASE_IMAGE=harbor.example.com/library/node:20-alpine ./scripts/dockerctl.sh up
        BASE_IMAGE: ${BASE_IMAGE:-node:20-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: bigdata-portal:latest
    container_name: bigdata-portal
    restart: unless-stopped
    ports:
      # 宿主机 9910 → 容器 9910(容器内网关监听 PORT=9910,healthcheck 同上)
      - "9910:9910"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      # 网关监听端口与对外保持一致(server/config.js 读 PORT)
      PORT: 9910
      # 工作流依赖缓存文件(docker 需挂载目录持久化,见 volumes)
      DS_DEPS_CACHE_FILE: /app/data/ds-deps.json
      # Jupyter 容器 host 网络监听宿主机 8888,经 host.docker.internal 访问;
      # 若 jupyter 跑在其他机器,改为 http://该机器IP:8888
      JUPYTER_URL: ${JUPYTER_URL:-http://host.docker.internal:8888}
    extra_hosts:
      # 让容器内 host.docker.internal 解析到宿主机(访问 host 网络的 jupyter)
      - "host.docker.internal:host-gateway"
    volumes:
      # 依赖缓存持久化(重启不丢;采集 4000+ 工作流需数分钟)
      - ./data:/app/data
    healthcheck:
      # 网关 /api/config 返回 200 视为健康
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9910/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
