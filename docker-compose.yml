# bigdata-portal Docker Compose
#
# 一键脚本入口:scripts/dockerctl.sh(等价命令见 README)。
# 凭证与各系统目标地址由 .env.local 在运行时注入(不经 .dockerignore,不会进镜像)。
# 若 .env.local 缺失,服务仍可启动,但子系统地址/免登录凭证回退到默认值。
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: bigdata-portal:latest
    container_name: bigdata-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    healthcheck:
      # 网关 /api/config 返回 200 视为健康
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
