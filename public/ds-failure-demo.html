<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>海豚失败根因定位 Demo（只读 · 直连 DS）</title>
<style>
  :root { --bd-primary:#5e6ad2; --bd-ok:#67c23a; --bd-fail:#f56c6c; --bd-warn:#e6a23c;
         --bd-border:#dcdfe6; --bd-panel:#fff; --bd-bg:#f5f7fa; --bd-muted:#909399; --bd-text:#303133; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
         background:var(--bd-bg); color:var(--bd-text); font-size:13px; }
  header { background:var(--bd-primary); color:#fff; padding:12px 20px; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .wrap { padding:16px; display:flex; flex-direction:column; gap:14px; max-width:1280px; margin:0 auto; }
  .card { background:var(--bd-panel); border:1px solid var(--bd-border); border-radius:8px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input, select, button { font-size:13px; padding:6px 10px; border:1px solid var(--bd-border);
         border-radius:6px; background:#fff; color:var(--bd-text); }
  button { cursor:pointer; background:var(--bd-primary); color:#fff; border-color:var(--bd-primary); }
  button.ghost { background:#fff; color:var(--bd-primary); }
  .muted { color:var(--bd-muted); }
  .err { color:var(--bd-fail); }
  .conn-box { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .conn-box input { width:360px; }
  .conn-box input.tok { width:300px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .fail-list { display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; margin-top:10px; }
  .fail-item { display:flex; gap:8px; align-items:center; padding:7px 10px; border:1px solid var(--bd-border);
              border-radius:6px; cursor:pointer; }
  .fail-item:hover { border-color:var(--bd-primary); }
  .fail-item.sel { border-color:var(--bd-primary); background:color-mix(in srgb,var(--bd-primary) 8%,#fff); }
  .tree { display:flex; gap:0; align-items:stretch; overflow-x:auto; padding:10px 0; min-height:120px; }
  .col { display:flex; flex-direction:column; gap:10px; justify-content:center; }
  .col.up { align-items:flex-end; }
  .col.cur { align-items:center; }
  .node { min-width:180px; max-width:250px; border:1px solid var(--bd-border); border-radius:8px; padding:8px 10px; background:#fff; }
  .node .nm { font-weight:600; font-size:12px; word-break:break-all; }
  .node .pr { color:var(--bd-muted); font-size:11px; margin-top:2px; word-break:break-all; }
  .node .st { font-size:11px; margin-top:4px; padding:1px 6px; border-radius:4px; display:inline-block; }
  .st.ok { color:var(--bd-ok); background:rgba(103,194,58,.12); }
  .st.fail { color:var(--bd-fail); background:rgba(245,108,108,.12); }
  .st.none { color:var(--bd-muted); background:var(--bd-bg); }
  .st.run { color:var(--bd-primary); background:color-mix(in srgb,var(--bd-primary) 12%,#fff); }
  .node.cur { border-color:var(--bd-primary); border-width:2px; box-shadow:0 2px 10px rgba(94,106,210,.18); }
  .node.root { border-color:var(--bd-fail); border-width:2px; box-shadow:0 2px 10px rgba(245,108,108,.18); }
  .badge { display:inline-block; font-size:10px; padding:0 5px; border-radius:4px; margin-left:4px;
           background:rgba(245,108,108,.15); color:var(--bd-fail); font-weight:700; }
  .conn { width:46px; align-self:center; border-top:2px solid var(--bd-border); flex:0 0 auto; }
  .upgroup { display:flex; flex-direction:column; align-items:flex-end; }
  .legend { font-size:11px; color:var(--bd-muted); display:flex; gap:14px; flex-wrap:wrap; }
  .legend span b { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<header>
  <h1>海豚调度 · 失败根因定位 Demo（只读 · 直连 DS）</h1>
  <div class="sub">实例级上游失败链回溯：选失败实例 → 沿 DEPENDENT 依赖向上定位根因（直连海豚 API，token 在本地，无需门户登录）</div>
</header>
<div class="wrap">
  <div class="card">
    <h2>0. 连接（直连海豚，填入 base + token）</h2>
    <div class="conn-box">
      <span class="muted">DS Base：</span><input id="base" value="http://olds.bigdata.shiqiao.com/dolphinscheduler" />
      <span class="muted">Token：</span>      <input id="tok" class="tok" value="2a323940d94d9a0c47f343d1c91304e2" />
      <button id="connect">加载项目</button>
      <span id="connState" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h2>1. 选择项目 / 失败实例</h2>
    <div class="row">
      <select id="proj"></select>
      <button id="loadFail">加载失败实例（近 7 天）</button>
      <span class="muted">或输入实例 ID：</span>
      <input id="instId" placeholder="如 9908359" style="width:140px" />
      <button class="ghost" id="loadInst">定位</button>
      <button class="ghost" id="loadExample">载入示例（lion_dw_app 失败链）</button>
    </div>
    <div id="failBox" class="fail-list"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">2. 失败根因树</h2>
      <div class="legend">
        <span><b style="background:var(--bd-fail)"></b>失败</span>
        <span><b style="background:var(--bd-ok)"></b>成功</span>
        <span><b style="background:var(--bd-muted)"></b>无匹配实例</span>
        <span><b style="background:var(--bd-fail);border:2px solid var(--bd-fail)"></b>根因（最上游失败）</span>
      </div>
    </div>
    <div id="treeBox" class="tree"><span class="muted">请先连接并选择失败实例…</span></div>
    <div id="rootMsg" class="muted" style="margin-top:8px"></div>
  </div>
</div>

<script>
let DS_BASE = '';
let DS_TOKEN = '';
let PROJ_MAP = {};   // projectId -> name (全量)

function enc(s){ return encodeURIComponent(s); }
function cfg(){ DS_BASE = document.getElementById('base').value.trim().replace(/\/$/,''); DS_TOKEN = document.getElementById('tok').value.trim(); }
async function ds(path){
  if (!DS_BASE || !DS_TOKEN) throw new Error('请先填写 DS Base 与 Token 并点“加载项目”');
  const r = await fetch(DS_BASE + path, { headers: { token: DS_TOKEN } });
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.msg || ('DS code ' + j.code));
  return j.data;
}
function fmtDate(s){
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function stClass(s){
  if (s === 'FAILURE') return 'fail';
  if (s === 'SUCCESS') return 'ok';
  if (s && s.startsWith('RUNNING')) return 'run';
  return 'none';
}
function stText(s){
  return { FAILURE:'失败', SUCCESS:'成功', RUNNING_EXEUTION:'运行中', RUNNING_EXECUTION:'运行中',
           PAUSE:'暂停', STOP:'停止' }[s] || (s || '无匹配实例');
}
function projName(id){ return PROJ_MAP[id] || ('项目#' + id); }

// 解析工作流定义里的 DEPENDENT 上游: [{projectId, processId}]
function parseUpstream(defData){
  const pdj = typeof defData.processDefinitionJson === 'string'
    ? JSON.parse(defData.processDefinitionJson) : defData.processDefinitionJson;
  const tasks = (pdj && pdj.tasks) || [];
  const ups = [];
  for (const t of tasks){
    const ty = String(t.type || t.taskType || '').toUpperCase();
    if (ty === 'DEPENDENT' && t.dependence && t.dependence.dependTaskList){
      for (const dt of t.dependence.dependTaskList){
        for (const it of dt.dependItemList || []){
          if (it.definitionId) ups.push({ projectId: it.projectId, processId: it.definitionId });
        }
      }
    }
  }
  return ups;
}

// 时间窗口匹配: 取失败实例 startTime 之前最近的一条上游实例
// 注意: DS 按 processDefinitionId 返回实例,与路径里的 project 无关,
// 因此统一用「有权限的根项目 rootProj」作为路径 project,避免上游项目名解析不出导致 404。
async function matchUpstreamInst(defId, failStart, rootProj){
  const end = new Date(failStart.getTime() + 3600 * 1000);
  const start = new Date(failStart.getTime() - 2 * 86400 * 1000);
  const p = n => String(n).padStart(2,'0');
  const f = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  try {
    const data = await ds(`/projects/${enc(rootProj)}/instance/list-paging?pageNo=1&pageSize=20&processDefinitionId=${defId}&startDate=${enc(f(start))}&endDate=${enc(f(end))}`);
    const list = (data && data.totalList) || [];
    const cands = list.filter(x => new Date(x.startTime) <= end).sort((a,b)=> new Date(b.startTime) - new Date(a.startTime));
    return cands[0] || null;
  } catch(e){ return null; }
}

// 递归构建上游失败链（实例级）; rootProj = 失败实例所属(有权限)项目, 所有 DS 查询都用它作路径 project
async function buildUpstream(pathProj, defId, failStart, visited, depth, rootProj){
  if (visited.has(defId) || depth > 12) return [];
  visited.add(defId);
  const def = await ds(`/projects/${enc(rootProj)}/process/select-by-id?processId=${defId}`);
  const ups = parseUpstream(def || {});
  const wfName = (def && def.name) || ('工作流#' + defId);
  const realPid = (def && def.projectId) || null;
  const nodes = [];
  for (const u of ups){
    const projLabel = realPid && PROJ_MAP[realPid] ? PROJ_MAP[realPid] : ('项目#' + (realPid || u.projectId));
    const inst = await matchUpstreamInst(u.processId, failStart, rootProj);
    const childStart = inst ? new Date(inst.startTime) : failStart;
    const childUp = await buildUpstream(rootProj, u.processId, childStart, visited, depth + 1, rootProj);
    nodes.push({
      projectId: realPid || u.projectId, processId: u.processId, projectName: projLabel, processName: wfName,
      instance: inst ? { instanceId: inst.id, state: inst.state, startTime: inst.startTime, name: inst.name } : null,
      upstream: childUp
    });
  }
  return nodes;
}

// 根因标记: 自身失败 且 其上游都没有失败
function markRoot(nodes){
  let roots = [];
  for (const n of nodes){
    const childRoots = markRoot(n.upstream || []);
    const selfFail = n.instance && n.instance.state === 'FAILURE';
    if (selfFail && childRoots.length === 0) n.isRoot = true;
    roots = roots.concat(childRoots);
    if (n.isRoot) roots.push(n);
  }
  return roots;
}

function renderNode(n, isCur){
  const cls = ['node'];
  if (isCur) cls.push('cur');
  if (n.isRoot) cls.push('root');
  const st = n.instance ? n.instance.state : null;
  const badge = n.isRoot ? '<span class="badge">根因</span>' : '';
  const stHtml = n.instance
    ? `<div class="st ${stClass(st)}">${stText(st)} · ${fmtDate(n.instance.startTime)}</div>`
    : `<div class="st none">近 2 天无匹配实例</div>`;
  return `<div class="${cls.join(' ')}">
      <div class="nm">${isCur ? '★ ' : ''}${n.processName || ('工作流#' + n.processId)}${badge}</div>
      <div class="pr">${n.projectName}</div>
      ${stHtml}
    </div>`;
}
function renderUp(nodes){
  if (!nodes || !nodes.length) return '';
  return nodes.map(n => {
    const child = renderUp(n.upstream);
    const self = renderNode(n, false);
    if (child) return `<div class="upgroup">${child}<div class="conn"></div>${self}</div>`;
    return self;
  }).join('<div class="conn"></div>');
}

async function locate(inst){
  document.getElementById('treeBox').innerHTML = '<span class="muted">回溯上游依赖中…</span>';
  document.getElementById('rootMsg').textContent = '';
  try {
    const defId = inst.processDefinitionId;
    const proj = inst._projectName || await resolveProjectOf(inst);
    const failStart = new Date(inst.startTime);
    const ups = await buildUpstream(proj, defId, failStart, new Set(), 0, proj);
    const rootNodes = markRoot(ups);
    const cur = { processName: inst.name, projectName: proj,
                  instance: { state: inst.state, startTime: inst.startTime }, processDefinitionId: defId };
    const html = `<div class="col up">${renderUp(ups)}</div>`
               + `<div class="conn"></div>`
               + `<div class="col cur">${renderNode(cur, true)}</div>`;
    document.getElementById('treeBox').innerHTML = html || '<span class="muted">该工作流无上游依赖</span>';
    if (rootNodes.length){
      document.getElementById('rootMsg').innerHTML =
        `检测到 <b style="color:var(--bd-fail)">${rootNodes.length}</b> 个根因（最上游失败）：`
        + rootNodes.map(r => `${r.projectName} / ${r.processName} (#${r.instance.instanceId}, ${fmtDate(r.instance.startTime)})`).join('；');
    } else {
      document.getElementById('rootMsg').textContent = '未找到上游失败根因 —— 当前工作流自身问题（上游实例均成功 / 无实例）。';
    }
  } catch(e){
    document.getElementById('treeBox').innerHTML = '<span class="err">回溯失败：' + e.message + '</span>';
  }
}

async function resolveProjectOf(inst){
  const sel = document.getElementById('proj').value;
  if (sel) return sel;
  return inst._projectName || '';
}

async function init(){
  cfg();
  const st = document.getElementById('connState');
  try {
    const all = await ds('/projects/query-project-list?pageNo=1&pageSize=300');
    (all.totalList || []).forEach(p => { PROJ_MAP[p.id] = p.name; });
    const acc = await ds('/projects/list-paging?pageNo=1&pageSize=100');
    document.getElementById('proj').innerHTML =
      (acc.totalList || []).map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    st.textContent = '已连接，' + (acc.totalList || []).length + ' 个项目可访问';
    st.className = 'muted';
  } catch(e){ st.textContent = '连接失败：' + e.message; st.className = 'err'; }
}

document.getElementById('connect').addEventListener('click', init);

document.getElementById('loadFail').addEventListener('click', async () => {
  const proj = document.getElementById('proj').value;
  if (!proj){ alert('请先连接并选择项目'); return; }
  const box = document.getElementById('failBox'); box.innerHTML = '<span class="muted">加载中…</span>';
  const p = n => String(n).padStart(2,'0');
  const end = new Date(), start = new Date(Date.now() - 7 * 86400 * 1000);
  const f = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  try {
    const data = await ds(`/projects/${enc(proj)}/instance/list-paging?pageNo=1&pageSize=50&stateType=FAILURE&startDate=${enc(f(start))}&endDate=${enc(f(end))}`);
    const list = (data.totalList || []);
    if (!list.length){ box.innerHTML = '<span class="muted">近 7 天无失败实例</span>'; return; }
    box.innerHTML = list.map(i => `<div class="fail-item" data-id="${i.id}" data-def="${i.processDefinitionId}" data-proj="${proj}" data-name="${i.name}" data-state="${i.state}" data-start="${i.startTime}">
        <b>#${i.id}</b><span>${i.name}</span><span class="muted">${fmtDate(i.startTime)}</span></div>`).join('');
    box.querySelectorAll('.fail-item').forEach(el => {
      el.addEventListener('click', () => {
        box.querySelectorAll('.fail-item').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
        locate({ id:+el.dataset.id, processDefinitionId:+el.dataset.def, _projectName:el.dataset.proj,
                 name:el.dataset.name, state:el.dataset.state, startTime:el.dataset.start });
      });
    });
    box.querySelector('.fail-item').click();
  } catch(e){ box.innerHTML = '<span class="err">失败：' + e.message + '</span>'; }
});

document.getElementById('loadInst').addEventListener('click', async () => {
  const id = document.getElementById('instId').value.trim();
  if (!id) return;
  try {
    const acc = await ds('/projects/list-paging?pageNo=1&pageSize=100');
    for (const p of acc.totalList || []){
      try {
        const data = await ds(`/projects/${enc(p.name)}/instance/list-paging?pageNo=1&pageSize=50`);
        const hit = (data.totalList || []).find(x => String(x.id) === id);
        if (hit){ locate({ id:hit.id, processDefinitionId:hit.processDefinitionId, _projectName:p.name, name:hit.name, state:hit.state, startTime:hit.startTime }); return; }
      } catch(e){}
    }
    alert('未在当前可访问项目中找到该实例 ID');
  } catch(e){ alert('查找失败：' + e.message); }
});

document.getElementById('loadExample').addEventListener('click', () => {
  document.getElementById('instId').value = '9908359';
  (async () => {
    const acc = await ds('/projects/list-paging?pageNo=1&pageSize=100');
    for (const p of acc.totalList || []){
      if (p.name !== 'lion_dw_app') continue;
      const data = await ds(`/projects/${enc(p.name)}/instance/list-paging?pageNo=1&pageSize=50&stateType=FAILURE`);
      const hit = (data.totalList || []).find(x => String(x.id) === '9908359');
      if (hit){ locate({ id:hit.id, processDefinitionId:hit.processDefinitionId, _projectName:p.name, name:hit.name, state:hit.state, startTime:hit.startTime }); return; }
    }
    alert('示例实例未找到（可能已过期），请改用「加载失败实例」');
  })();
});
</script>
</body>
</html>
